- name: scrape failure fires after 5m and recovers; value rules stay silent while blind
  interval: 1m
  input_series:
  - series: up{job="veea-api",instance="api-1:9090"}
    values: 1x10 0x20 1x20
  - series: admin_super_admin_bootstrapped{job="veea-api",instance="api-1:9090"}
    values: 1x10 _x20 1x20
  - series: admin_active_super_admins{job="veea-api",instance="api-1:9090"}
    values: 1x10 _x20 1x20
  alert_rule_test:
  - eval_time: 13m
    alertname: VeeaApiScrapeFailing
    exp_alerts: []
  - eval_time: 17m
    alertname: VeeaApiScrapeFailing
    exp_alerts:
    - exp_labels:
        severity: critical
        job: veea-api
        instance: api-1:9090
      exp_annotations:
        summary: Prometheus cannot scrape a Veea API metrics endpoint.
        description: A known target has failed every scrape for 5 minutes. Its other alerts cannot fire while it is down;
          treat it as blind, not healthy.
        runbook: docs/trd/08-monitoring-alerting.md#51-scrape-failing-or-absent
  - eval_time: 25m
    alertname: VeeaNoActiveSuperAdmin
    exp_alerts: []
  - eval_time: 25m
    alertname: VeeaApiMonitoringSeriesMissing
    exp_alerts: []
  - eval_time: 35m
    alertname: VeeaApiScrapeFailing
    exp_alerts: []
- name: no target at all is absent, not failing
  interval: 1m
  input_series:
  - series: email_outbox_pending{job="other",instance="api-1:9090"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 8m
    alertname: VeeaApiScrapeTargetAbsent
    exp_alerts: []
  - eval_time: 12m
    alertname: VeeaApiScrapeTargetAbsent
    exp_alerts:
    - exp_labels:
        severity: critical
        job: veea-api
      exp_annotations:
        summary: No Veea API scrape target exists at all.
        description: Prometheus has no up series for job veea-api, so service discovery or the scrape configuration lost every
          target.
        runbook: docs/trd/08-monitoring-alerting.md#51-scrape-failing-or-absent
  - eval_time: 12m
    alertname: VeeaApiScrapeFailing
    exp_alerts: []
- name: scraped but gauges missing is reported, never read as a healthy zero
