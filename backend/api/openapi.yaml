  /v1/admin/users/{user_id}/lifecycle-transitions:
    post:
      tags: [admin]
      operationId: transitionAdminUser
      summary: Suspend or reinstate the target (TRD 06 §5.2, §5.3).
      description: |
        Suspension saves the interrupted state, revokes every target session and cancels exports.
        Reinstatement restores exactly that state without reviving sessions or proofs. If the
        requested end state already holds the answer is 200 with no change and no event; otherwise
        `expected_lifecycle_revision` must match. Pending-deletion targets are `409 status_conflict`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminUserID" }
      x-error-codes: [invalid_request, unsupported_media_type, unauthorized, forbidden, target_not_permitted, not_found, lifecycle_conflict, status_conflict, rate_limited, internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTransitionRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/AdminNotFound" }
        "409": { $ref: "#/components/responses/AdminConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/admin/users/{user_id}/role:
    put:
      tags: [admin]
      operationId: changeAdminUserRole
      summary: Change the target's role; Super Admin only (TRD 06 §5.1).
      description: |
        Promotion revokes every target session and requires an active, verified target. Demotion keeps
        sessions and applies on the next request. A Super Admin's only self change is stepping down to
        `user` while another active Super Admin remains (`409 last_super_admin` otherwise). If the target
        already has `role` the answer is 200 with no change; otherwise `expected_role_revision` must match.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/AdminUserID" }
      x-error-codes: [invalid_request, unsupported_media_type, unauthorized, forbidden, target_not_permitted, not_found, role_conflict, status_conflict, last_super_admin, rate_limited, internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/AdminNotFound" }
        "409": { $ref: "#/components/responses/AdminConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    rightsAuth:
      type: http
      scheme: Rights
      description: One opaque vop_ capability, limited to its action and operation; never a session.
    bearerAuth:
      type: http
      scheme: bearer
      description: "`Authorization: Bearer vat_…`, exactly one header. Checked in PostgreSQL on every request (TRD 8.1)."

  headers:
    X-Request-Id:
      description: Echoes a well-formed inbound id (8 to 64 of `[A-Za-z0-9_-]`, no token prefix) or a generated one.
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
    Cache-Control:
      required: true
      schema: { type: string, enum: [no-store] }
    Retry-After:
      description: Whole seconds until the refusing limit's window ends, at least 1.
      required: true
      schema: { type: integer, minimum: 1 }
    WWW-Authenticate:
      required: true
      schema: { type: string, enum: [Bearer] }

  parameters:
    AdminUserID:
      in: path
      name: user_id
      required: true
      description: Nonzero, 36-character hyphenated account UUID. Authentication and the staff check precede path validation.
      schema: { type: string, format: uuid }

  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { $ref: "#/components/schemas/EmailInput" }
    CodeWithDevice:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge_token, code, device]
            properties:
              challenge_token: { type: string }
              code: { type: string, description: The 6-digit code. Any other string is a wrong code. }
              device: { $ref: "#/components/schemas/Device" }
    CodeWithPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [challenge_token, code, new_password]
            properties:
              challenge_token: { type: string }
              code: { type: string }
              new_password: { type: string }

  responses:
    SyncUnavailable:
      description: "`sync_unavailable`: learning sync is closed (TRD 05 §8.2, §15.2). Retry later."
      x-codes: [sync_unavailable]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SyncReset:
      description: "`sync_reset_required`, with `reason` and the current `epoch`. Nothing was applied."
      x-codes: [sync_reset_required]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Problem" }
              - { type: object, required: [reason, epoch] }
    PayloadTooLarge:
      description: "`payload_too_large`: over 2 MiB or 200 mutations."
      x-codes: [payload_too_large]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ExportExpired:
      description: The export download expired.
      x-codes: [export_expired]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Health:
      description: Healthy.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status: { type: string, enum: [ok] }
    Acknowledgement:
      description: Accepted. The same body for eligible and ineligible requests, apart from token and timestamps.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Acknowledgement" }
    Tokens:
      description: A new session. Sent only after the transaction that created it committed.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenResponse" }
    AccountUser:
      description: Current account and profile.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }
    EmailChangeStarted:
      description: Both proof acknowledgements, regardless of destination eligibility.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [change_id, current_email, new_email]
            properties:
              change_id: { type: string, format: uuid }
              current_email: { $ref: "#/components/schemas/Acknowledgement" }
              new_email: { $ref: "#/components/schemas/Acknowledgement" }
    InvalidProfile:
      description: An editable profile value is invalid.
      x-codes: [invalid_profile]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AdminUser:
      description: The account's administrative view after the request.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    AdminForbidden:
      description: "`forbidden`: the actor is not staff. `target_not_permitted`: the TRD 06 matrix refuses this actor, target and action."
      x-codes: [forbidden, target_not_permitted]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AdminNotFound:
      description: Unknown or purged account, or a session the target does not own.
      x-codes: [not_found]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AdminConflict:
      description: "`lifecycle_conflict` or `role_conflict`: stale expected revision. `status_conflict` (with `account_status`): the target's status does not allow it. `last_super_admin`: no other active Super Admin would remain."
      x-codes: [lifecycle_conflict, role_conflict, status_conflict, last_super_admin]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    OwnedRequestNotFound:
      description: Unknown or foreign request. No ownership disclosure.
      x-codes: [not_found]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NoContent:
      description: Done. No body.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
    BadRequest:
      description: "`invalid_request`, `invalid_email`, `invalid_code` or `code_attempts_exceeded`."
      x-codes: [invalid_request, invalid_email, invalid_code, code_attempts_exceeded]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "`unauthorized`: the token does not authenticate. Never says why."
      x-codes: [unauthorized]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        WWW-Authenticate: { $ref: "#/components/headers/WWW-Authenticate" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InvalidCredentials:
      description: "`invalid_credentials`, the same for every credential failure (AC-7)."
      x-codes: [invalid_credentials]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "`account_unavailable` or `invalid_current_password`."
      x-codes: [account_unavailable, invalid_current_password]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "`signup_unavailable`, `password_already_set`, `password_not_set` or `current_session_not_allowed`."
      x-codes: [signup_unavailable, password_already_set, password_not_set, current_session_not_allowed, profile_conflict, email_unchanged, email_unavailable, lifecycle_conflict, export_not_ready, operation_canceled, sequence_gap, capacity_changed, last_super_admin]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SessionNotFound:
      description: Unknown or foreign session; never discloses ownership.
      x-codes: [not_found]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Cache-Control: { $ref: "#/components/headers/Cache-Control" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: "`unsupported_media_type`: Content-Type is missing or is not application/json."
      x-codes: [unsupported_media_type]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PolicyViolation:
      description: "`password_policy_violation`, with every violated rule in `violations`."
      x-codes: [password_policy_violation]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/Problem" }
              - { type: object, required: [violations] }
    TooManyRequests:
      description: "`rate_limited`. The same for every eligibility (AC-27)."
      x-codes: [rate_limited]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: "`internal_error`. Details are logged by request id only."
      x-codes: [internal_error]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: "`not_ready`: the database did not answer in time."
      x-codes: [not_ready]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Busy:
      description: "`busy`: password hashing is saturated (TRD 9.2). Retry after a second."
      x-codes: [busy]
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
        Retry-After: { $ref: "#/components/headers/Retry-After" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    EmailInput:
      type: string
      description: Trimmed, then parsed and normalized as TRD 3.2. Compared case-insensitively (AC-8).
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 in UTC.
    Token:
      type: string
      pattern: "^v(ct|at|rt)_[A-Za-z0-9_-]{43}$"
    Device:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: "Not blank, no control characters." }
        platform: { type: string, enum: [ios, android, web, other] }
    Acknowledgement:
      type: object
      additionalProperties: false
      required: [challenge_token, expires_at, resend_after]
      properties:
        challenge_token:
          allOf: [{ $ref: "#/components/schemas/Token" }, { pattern: "^vct_" }]
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        resend_after: { $ref: "#/components/schemas/Timestamp" }
    Profile:
      type: object
      additionalProperties: false
      required: [display_name, preferred_language, time_zone, daily_goal, revision]
      properties:
        display_name: { type: string, nullable: true, minLength: 1, maxLength: 64 }
        preferred_language: { type: string, enum: [en, vi] }
        time_zone: { type: string, minLength: 1 }
        daily_goal: { type: integer, minimum: 1, maximum: 1000, description: "Target words reviewed per day; a preference, not progress." }
        revision: { type: integer, minimum: 0 }
    ProfileRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, display_name, preferred_language, time_zone, daily_goal]
      properties:
        expected_revision: { type: integer, minimum: 0 }
        display_name: { type: string, nullable: true }
        preferred_language: { type: string }
        time_zone: { type: string }
        daily_goal: { type: integer }
    EmailChangeStart:
      type: object
      additionalProperties: false
      required: [new_email]
      properties:
        new_email: { type: string }
    EmailChangeComplete:
      type: object
      additionalProperties: false
      required: [current_challenge_token, current_code, new_challenge_token, new_code]
      properties:
        current_challenge_token: { type: string }
        current_code: { type: string }
        new_challenge_token: { type: string }
        new_code: { type: string }
    User:
      type: object
      additionalProperties: false
      required: [id, email, email_verified_at, has_password, password_changed_at, status, role, created_at, profile, lifecycle_revision]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Current verified sign-in address. }
        lifecycle_revision: { type: integer, minimum: 0 }
        profile: { $ref: "#/components/schemas/Profile" }
        email_verified_at: { type: string, format: date-time, nullable: true }
        has_password: { type: boolean }
        password_changed_at:
          type: string
          format: date-time
          nullable: true
          description: Informational only; never proof that a particular request succeeded (TRD 5.2).
        status: { type: string, enum: [active, suspended, deactivated, pending_deletion] }
        role: { type: string, enum: [user, admin, super_admin] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    SessionList:
      type: object
      additionalProperties: false
      required: [current_session_id, sessions]
      properties:
        current_session_id: { type: string, format: uuid }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, device_name, platform, created_at, last_seen_at, refresh_expires_at, absolute_expires_at, is_current]
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string, minLength: 1, maxLength: 64 }
        platform: { type: string, enum: [ios, android, web, other] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        refresh_expires_at: { $ref: "#/components/schemas/Timestamp" }
        absolute_expires_at: { $ref: "#/components/schemas/Timestamp" }
        is_current: { type: boolean }
    TokenResponse:
      type: object
      additionalProperties: false
      required: [session_id, access_token, access_expires_at, refresh_token, refresh_expires_at, user]
      properties:
        session_id: { type: string, format: uuid }
        access_token:
          allOf: [{ $ref: "#/components/schemas/Token" }, { pattern: "^vat_" }]
        access_expires_at: { $ref: "#/components/schemas/Timestamp" }
        refresh_token:
          allOf: [{ $ref: "#/components/schemas/Token" }, { pattern: "^vrt_" }]
        refresh_expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/User" }
    ErrorCode:
      type: string
      enum:
        - sync_unavailable
        - sync_reset_required
        - sequence_gap
        - capacity_changed
        - payload_too_large
        - lifecycle_conflict
        - export_not_ready
        - operation_canceled
        - export_expired
        - invalid_profile
        - profile_conflict
        - email_unchanged
        - email_unavailable
        - invalid_request
        - invalid_email
        - password_policy_violation
        - invalid_code
        - code_attempts_exceeded
        - signup_unavailable
        - rate_limited
        - unauthorized
        - invalid_credentials
        - account_unavailable
        - password_already_set
        - password_not_set
        - invalid_current_password
        - busy
        - internal_error
        - not_ready
        - current_session_not_allowed
        - not_found
        - method_not_allowed
        - unsupported_media_type
        - forbidden
        - target_not_permitted
        - role_conflict
        - status_conflict
        - last_super_admin
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, enum: [about:blank] }
        title: { type: string, description: From a fixed table keyed by code; never derived from an error value. }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: "#/components/schemas/ErrorCode" }
        request_id: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
        violations:
          type: array
          minItems: 1
          items: { type: string, enum: [too_short, too_long, too_common, contains_email] }
        reason: { type: string, enum: [epoch_changed, writer_unknown, cursor_compacted, cursor_ahead], description: sync_reset_required only. }
        epoch: { type: string, format: uuid, description: "sync_reset_required only: the owner's current epoch." }
        live_words: { type: integer, description: capacity_changed only. }
        content_bytes: { type: integer, description: capacity_changed only. }
        last_seq: { type: integer, description: "capacity_changed only: the writer's high-water mark, unchanged." }
        account_status: { type: string, enum: [active, suspended, deactivated, pending_deletion], description: "status_conflict only: the target's current status." }

    DeactivateRequest:
      type: object
      additionalProperties: false
      required: [confirm, expected_revision]
      properties:
        confirm: { type: boolean, enum: [true] }
        expected_revision: { type: integer, minimum: 0 }
    EmailRightsRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
    RightsProofRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code]
      properties:
        challenge_token: { type: string }
        code: { type: string }
    DeleteProofRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code, confirm]
      properties:
        challenge_token: { type: string }
        code: { type: string }
        confirm: { type: string, enum: [delete_account] }
    RightsStarted:
      type: object
      additionalProperties: false
      required: [operation_id, operation_token, challenge_token, expires_at, resend_after]
      properties:
        operation_id: { type: string, format: uuid }
        operation_token: { type: string, pattern: '^vop_[A-Za-z0-9_-]{43}$' }
        challenge_token: { $ref: "#/components/schemas/Token" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        resend_after: { $ref: "#/components/schemas/Timestamp" }
    RightsOperation:
      type: object
      additionalProperties: false
      required: [operation_id, action, state, requested_at, accepted_at, completed_at, expires_at, download_expires_at, backup_expiry_due_at]
      properties:
        operation_id: { type: string, format: uuid }
        action: { type: string, enum: [export, delete, reactivate] }
        state: { type: string, enum: [awaiting_proof, pending, ready, completed, canceled, expired] }
        requested_at: { $ref: "#/components/schemas/Timestamp" }
        accepted_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        download_expires_at: { type: string, format: date-time, nullable: true }
        backup_expiry_due_at: { type: string, format: date-time, nullable: true }
    AccountExport:
      type: object
      additionalProperties: false
      required: [schema_version, snapshot_at, snapshot_revision, account, vocabulary]
      properties:
        schema_version: { type: integer, enum: [2] }
        snapshot_at: { $ref: "#/components/schemas/Timestamp" }
        snapshot_revision: { type: integer, minimum: 0 }
        account:
          type: object
          additionalProperties: false
          required: [user_id, email, email_verified_at, created_at, display_name, preferred_language, time_zone, daily_goal]
          properties:
            user_id: { type: string, format: uuid }
            email: { type: string }
            email_verified_at: { type: string, format: date-time, nullable: true }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            display_name: { type: string, nullable: true }
            preferred_language: { type: string, enum: [en, vi] }
            time_zone: { type: string }
            daily_goal: { type: integer }
        vocabulary:
          type: array
          maxItems: 50000
          items:
            type: object
            additionalProperties: false
            required: [id, revision, capture_day, client_created_at, created_at, updated_at, content]
            properties:
              id: { type: string, format: uuid }
              revision: { type: integer, minimum: 1 }
              capture_day: { type: string, format: date }
              client_created_at: { $ref: "#/components/schemas/Timestamp" }
              created_at: { $ref: "#/components/schemas/Timestamp" }
              updated_at: { $ref: "#/components/schemas/Timestamp" }
              content: { $ref: "#/components/schemas/VocabularyContent" }
    EmptyRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    VocabularyContent:
      type: object
      additionalProperties: false
      required: [word, meaning, pronunciation, part_of_speech, source, examples, tags]
      properties:
        word: { type: string }
        meaning: { type: string }
        pronunciation: { type: string, nullable: true }
        part_of_speech: { type: string, nullable: true, enum: [n, v, adj, adv, phr, idm, etc, null] }
        source: { type: string, nullable: true }
        examples: { type: array, maxItems: 20, items: { type: string } }
        tags: { type: array, maxItems: 30, items: { type: string } }
    VocabularyRecord:
      type: object
      additionalProperties: false
      required: [entity_id, revision, deleted, content, capture_day, client_created_at, updated_at]
      description: The canonical server state of one word. A tombstone (deleted) has null content and dates.
      properties:
        entity_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        content:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VocabularyContent" }]
        capture_day: { type: string, format: date, nullable: true }
        client_created_at: { type: string, format: date-time, nullable: true }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    LearningWriterState:
      type: object
      nullable: true
      additionalProperties: false
      required: [writer_id, last_seq, active]
      properties:
        writer_id: { type: string, format: uuid }
        last_seq: { type: integer, minimum: 0, description: "High-water mark. It proves processing, not that an edit applied." }
        active: { type: boolean }
    LearningState:
      type: object
      additionalProperties: false
      required: [epoch, head_revision, tombstone_horizon, live_words, word_limit, content_bytes, content_byte_limit, writer]
      properties:
        epoch: { type: string, format: uuid }
        head_revision: { type: integer, minimum: 0 }
        tombstone_horizon: { type: integer, minimum: 0 }
        live_words: { type: integer, minimum: 0 }
        word_limit: { type: integer, enum: [50000] }
        content_bytes: { type: integer, minimum: 0 }
        content_byte_limit: { type: integer, enum: [67108864] }
        writer: { $ref: "#/components/schemas/LearningWriterState" }
    LearningWriter:
      type: object
      additionalProperties: false
      required: [writer_id, last_seq, epoch]
      properties:
        writer_id: { type: string, format: uuid }
        last_seq: { type: integer, enum: [0] }
        epoch: { type: string, format: uuid }
    LearningMutation:
      type: object
      description: |
        One queued change (TRD 05 §5.3). The fields present depend on op: create {seq, op, entity_id, data};
        update {seq, op, entity_id, base_revision, changed_fields, data with exactly those fields};
        delete {seq, op, entity_id, base_revision}; restore {seq, op, entity_id, base_revision, data}.
        A full data object holds every VocabularyContent field plus capture_day (YYYY-MM-DD) and
        client_created_at (RFC 3339). The deduplication hash covers the exact bytes of this object.
      required: [seq, op, entity_id]
      properties:
        seq: { type: integer, minimum: 1 }
        op: { type: string, enum: [create, update, delete, restore] }
        entity_id: { type: string, format: uuid }
        base_revision: { type: integer, minimum: 0 }
        changed_fields:
          type: array
          minItems: 1
          items: { type: string, enum: [word, meaning, pronunciation, part_of_speech, source, examples, tags, capture_day] }
        data: { type: object }
    LearningPushRequest:
      type: object
      additionalProperties: false
      required: [epoch, writer_id, mutations]
      properties:
        epoch: { type: string, format: uuid }
        writer_id: { type: string, format: uuid }
        mutations: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/LearningMutation" } }
    LearningImportRequest:
      type: object
      additionalProperties: false
      required: [epoch, writer_id, capacity_basis, mutations]
      properties:
        epoch: { type: string, format: uuid }
        writer_id: { type: string, format: uuid }
        capacity_basis:
          type: object
          additionalProperties: false
          required: [live_words, content_bytes]
          properties:
            live_words: { type: integer, minimum: 0 }
            content_bytes: { type: integer, minimum: 0 }
        mutations: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/LearningMutation" } }
    LearningItemResult:
      type: object
      additionalProperties: false
      required: [seq, entity_id, outcome, record]
      properties:
        seq: { type: integer, minimum: 1 }
        entity_id: { type: string, format: uuid }
        outcome: { type: string, enum: [applied, merged, no_op, duplicate, rejected] }
        original_outcome: { type: string, enum: [applied, merged, no_op, rejected], description: duplicate only. }
        code: { type: string, enum: [invalid_item, mutation_reused, mutation_expired, stale_base, unknown_item, deleted_on_server, quota_exceeded, id_in_use] }
        detail: { type: string, enum: [invalid_utf8, control_character, invalid_part_of_speech, invalid_date, field_empty, too_many_entries, field_too_long, item_too_large] }
        field: { type: string, enum: [word, meaning, pronunciation, part_of_speech, source, examples, tags] }
        limit: { type: string, enum: [words, bytes] }
        conflicted_fields: { type: array, items: { type: string } }
        revision: { type: integer, minimum: 1 }
        record:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/VocabularyRecord" }]
    LearningPushResult:
      type: object
      additionalProperties: false
      required: [results, head_revision, live_words, content_bytes, last_seq]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/LearningItemResult" } }
        head_revision: { type: integer, minimum: 0 }
        live_words: { type: integer, minimum: 0 }
        content_bytes: { type: integer, minimum: 0 }
        last_seq: { type: integer, minimum: 0 }
    LearningChanges:
      type: object
      additionalProperties: false
      required: [epoch, changes, cursor, has_more]
      properties:
        epoch: { type: string, format: uuid }
        changes: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/VocabularyRecord" } }
        cursor: { type: string, pattern: '^c1\.[A-Za-z0-9_-]{32}$' }
        has_more: { type: boolean }
    LearningSnapshot:
      type: object
      additionalProperties: false
      required: [epoch, snapshot_revision, items, next_page_token, catch_up_cursor]
      properties:
        epoch: { type: string, format: uuid }
        snapshot_revision: { type: integer, minimum: 0 }
        items: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/VocabularyRecord" } }
        next_page_token: { type: string, nullable: true, pattern: '^s1\.[A-Za-z0-9_-]{54}$' }
        catch_up_cursor: { type: string, pattern: '^c1\.[A-Za-z0-9_-]{32}$' }
    AdminTicketRef:
      type: string
      nullable: true
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$'
      description: Optional external ticket identifier. No spaces, no @, nothing token-shaped.
    AdminListItem:
      type: object
      additionalProperties: false
      required: [id, email, status, role, created_at, state_changed_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string, enum: [active, suspended, deactivated, pending_deletion] }
        role: { type: string, enum: [user, admin, super_admin] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        state_changed_at: { type: string, format: date-time, nullable: true }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, next_page_token]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AdminListItem" } }
        next_page_token: { type: string, nullable: true, pattern: '^a1\.[A-Za-z0-9_-]{43}$' }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, email_verified_at, has_password, password_changed_at, display_name, preferred_language, time_zone,
        created_at, status, lifecycle_revision, state_changed_at, suspension, pending_deletion, role, role_revision,
        role_changed_at, sessions, allowed_actions, assignable_roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified_at: { type: string, format: date-time, nullable: true }
        has_password: { type: boolean }
        password_changed_at: { type: string, format: date-time, nullable: true }
        display_name: { type: string, nullable: true }
        preferred_language: { type: string }
        time_zone: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        status: { type: string, enum: [active, suspended, deactivated, pending_deletion] }
        lifecycle_revision: { type: integer, minimum: 0 }
        state_changed_at: { type: string, format: date-time, nullable: true }
        suspension:
          type: object
          nullable: true
          additionalProperties: false
          required: [reason_code, ticket_ref, suspended_at, suspended_by_user_id, resume_status]
          properties:
            reason_code: { type: string }
            ticket_ref: { $ref: "#/components/schemas/AdminTicketRef" }
            suspended_at: { type: string, format: date-time, nullable: true }
            suspended_by_user_id: { type: string, format: uuid, nullable: true }
            resume_status: { type: string, enum: [active, deactivated] }
        pending_deletion:
          type: object
          nullable: true
          additionalProperties: false
          required: [accepted_at]
          properties:
            accepted_at: { type: string, format: date-time, nullable: true }
        role: { type: string, enum: [user, admin, super_admin] }
        role_revision: { type: integer, minimum: 0 }
        role_changed_at: { type: string, format: date-time, nullable: true }
        sessions:
          type: object
          additionalProperties: false
          required: [live_count, last_seen_at]
          properties:
            live_count: { type: integer, minimum: 0 }
            last_seen_at: { type: string, format: date-time, nullable: true }
        allowed_actions:
          type: array
          items: { type: string, enum: [suspend, reinstate, change_role, view_sessions, revoke_sessions] }
        assignable_roles:
          type: array
          items: { type: string, enum: [user, admin, super_admin] }
    AdminSessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, device_name, platform, created_at, last_seen_at, refresh_expires_at, absolute_expires_at]
            properties:
              id: { type: string, format: uuid }
              device_name: { type: string, minLength: 1, maxLength: 64 }
              platform: { type: string, enum: [ios, android, web, other] }
              created_at: { $ref: "#/components/schemas/Timestamp" }
              last_seen_at: { $ref: "#/components/schemas/Timestamp" }
              refresh_expires_at: { $ref: "#/components/schemas/Timestamp" }
              absolute_expires_at: { $ref: "#/components/schemas/Timestamp" }
    AdminSessionRevocationRequest:
      type: object
      additionalProperties: false
      required: [session_id, reason_code, ticket_ref]
      properties:
        session_id: { type: string, format: uuid, nullable: true, description: null revokes every target session. }
        reason_code: { type: string, enum: [account_compromise, owner_request, security_review, other] }
        ticket_ref: { $ref: "#/components/schemas/AdminTicketRef" }
    AdminTransitionRequest:
      type: object
      additionalProperties: false
      required: [action, reason_code, ticket_ref, expected_lifecycle_revision]
      properties:
        action: { type: string, enum: [suspend, reinstate] }
        reason_code:
          type: string
          description: "suspend: abuse, fraud, account_compromise, policy_violation, legal_request, owner_request, other. reinstate: appeal_upheld, issue_resolved, suspended_in_error, other."
        ticket_ref: { $ref: "#/components/schemas/AdminTicketRef" }
        expected_lifecycle_revision: { type: integer, minimum: 0 }
    AdminRoleRequest:
      type: object
      additionalProperties: false
      required: [role, reason_code, ticket_ref, expected_role_revision]
      properties:
        role: { type: string, enum: [user, admin, super_admin] }
        reason_code: { type: string, enum: [staffing_change, access_review, account_compromise, other] }
        ticket_ref: { $ref: "#/components/schemas/AdminTicketRef" }
        expected_role_revision: { type: integer, minimum: 0 }
    AdminAuditEntry:
      type: object
      additionalProperties: false
      required: [occurred_at, action, outcome, actor_user_id, reason_code, ticket_ref]
      properties:
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        action: { type: string, enum: [suspend, reinstate, role_change, role_bootstrap, sessions_revoke] }
        outcome: { type: string, enum: [success, failure] }
        actor_user_id: { type: string, format: uuid, nullable: true, description: The acting staff account; null for the CLI bootstrap. }
        reason_code: { type: string, nullable: true, description: The fixed TRD 06 reason code. }
        ticket_ref: { $ref: "#/components/schemas/AdminTicketRef" }
    AdminAuditPage:
      type: object
      additionalProperties: false
      required: [items, next_page_token]
      properties:
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AdminAuditEntry" } }
        next_page_token: { type: string, nullable: true, pattern: '^h1\.[A-Za-z0-9_-]{32}$' }
