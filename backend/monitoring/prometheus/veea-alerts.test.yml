    alertname: VeeaApiMonitoringSeriesMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        job: veea-api
        instance: api-1:9090
      exp_annotations:
        summary: A scraped Veea API instance does not export all TRD 08 gauges.
        description: The scrape succeeds but at least one database-backed gauge is absent, so the alerts built on it are silent.
          A missing series is not a healthy zero.
        runbook: docs/trd/08-monitoring-alerting.md#52-monitoring-series-missing-or-read-failed
  - eval_time: 15m
