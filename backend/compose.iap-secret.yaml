# Optional with either base Compose file. The private key is available only to the API.
services:
  api:
    environment:
      VEEA_APPLE_IAP_PRIVATE_KEY_FILE: /run/secrets/veea_apple_iap_key
    secrets:
      - veea_apple_iap_key

secrets:
  veea_apple_iap_key:
    file: ${VEEA_APPLE_IAP_KEY_HOST_FILE:?Set the private host path to the Apple In-App Purchase key}
