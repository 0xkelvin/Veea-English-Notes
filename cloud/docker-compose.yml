name: english-notes-cloud

services:
  # ── Application ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-api
    ports:
      - "${APP_PORT:-18386}:18386"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://app_user:app_password@postgres:5432/english_notes
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - veea-camera

  # ── PostgreSQL (internal only — no host port, avoids clashing with other
  #   projects' Postgres on 5432; the app reaches it via the "postgres"
  #   service name on the default network) ────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: english_notes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d english_notes"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Redis (internal only) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── NATS (internal only — no host port, avoids clashing with other
  #   projects' NATS on 4222/8222) ─────────────────────────────────────────
  nats:
    image: nats:2-alpine
    command: ["--js", "--http_port", "8222"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  veea-camera:
    external: true
    name: veea-camera_default
