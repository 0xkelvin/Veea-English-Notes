openapi: 3.0.3
info:
  title: Veea English Notes — Accounts API
  version: 1.6.0-trd06-audit
  description: |
    Email authentication and account foundation (TRD 01 §5), plus session management (TRD 02), account lifecycle (TRD 04),
    vocabulary sync (TRD 05) and RBAC user administration (TRD 06). This document is normative for the
    Go service in `backend/`: every route the router registers is listed here, and the
    integration suite validates every response it receives against it.

    Conventions (TRD 01 §5.1):
    - JSON bodies require `Content-Type: application/json`; a missing or other content type is
      `415 unsupported_media_type`. The body is then decoded strictly: one object, at most 16 KiB
      (2 MiB for the vocabulary push and import, over which the answer is `413 payload_too_large`),
      keys spelled exactly as documented, no duplicate or unknown keys, every field present, no
      trailing data. Anything else is `400 invalid_request`.
    - A path that is not listed gets `404 not_found`, and a listed path with another method gets
      `405 method_not_allowed` with `Allow`, both as problem documents. `HEAD` is not served.
    - Every response carries `X-Request-Id`. JSON and 204 responses carry `Cache-Control: no-store`.
    - Errors are RFC 9457 `application/problem+json` with a stable `code` and the `request_id`.
      Each operation lists the codes it can return in `x-error-codes`.
    - Timestamps are RFC 3339 in UTC.
    - Tokens: challenge `vct_…`, access `vat_…`, refresh `vrt_…`, each followed by 43 base64url
      characters. Only the responses below ever contain them.
servers:
  - url: /
tags:
  - name: health
  - name: signup
  - name: signin
  - name: password
  - name: account
  - name: session
  - name: learning
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness. Ignores the database.
      x-error-codes: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Readiness. Checks the database within VEEA_READY_TIMEOUT.
      x-error-codes: [not_ready]
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/auth/signup/otp/start:
    post:
      tags: [signup]
      operationId: signupOtpStart
      summary: Endpoint 1. Start an OTP signup (Flow A).
      description: |
        Same 202 for new and existing emails (AC-27). Only a new email gets a `signup_code` email.
        An existing account is never changed.
      x-error-codes: [invalid_request, invalid_email, unsupported_media_type, rate_limited, internal_error]
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Acknowledgement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/signup/password/start:
    post:
      tags: [signup]
      operationId: signupPasswordStart
      summary: Endpoint 2. Start a password signup (Flow B).
      description: |
        The password policy is checked first (422 before anything else), then the per-IP limit,
        then Argon2id, then the start. Same 202 for new and existing emails; the pending hash is
        bound to the new challenge only for a new email.
      x-error-codes: [invalid_request, invalid_email, password_policy_violation, unsupported_media_type, rate_limited, busy, internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { $ref: "#/components/schemas/EmailInput" }
                password: { type: string }
      responses:
        "202": { $ref: "#/components/responses/Acknowledgement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Busy" }
  /v1/auth/signup/verify:
    post:
      tags: [signup]
      operationId: signupVerify
      summary: Endpoint 3. Verify a signup and create the account and its first session.
      description: |
        `409 signup_unavailable` when the email gained an account after the attempt started:
        the code is consumed, nothing about the account changes and no session is issued (R5).
      x-error-codes: [invalid_request, invalid_code, code_attempts_exceeded, signup_unavailable, unsupported_media_type, rate_limited, internal_error]
      requestBody: { $ref: "#/components/requestBodies/CodeWithDevice" }
      responses:
        "201": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/auth/otp/start:
    post:
      tags: [signin]
      operationId: otpStart
      summary: Endpoint 4. Start an OTP sign-in (Flow C).
      description: Same 202 for every email. Only an active, verified account gets a `login_code` email.
      x-error-codes: [invalid_request, invalid_email, unsupported_media_type, rate_limited, internal_error]
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Acknowledgement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/otp/verify:
    post:
      tags: [signin]
      operationId: otpVerify
      summary: Endpoint 5. Verify an OTP sign-in and create a session.
      x-error-codes: [invalid_request, invalid_code, code_attempts_exceeded, unsupported_media_type, rate_limited, internal_error]
      requestBody: { $ref: "#/components/requestBodies/CodeWithDevice" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/password/login:
    post:
      tags: [signin]
      operationId: passwordLogin
      summary: Endpoint 6. Password sign-in (Flow D).
      description: |
        Unknown email, wrong password, passwordless account and pending registration all get the
        same `401 invalid_credentials` (AC-7). `403 account_unavailable` only after the password
        verified. A malformed email is `400 invalid_request` here.
      x-error-codes: [invalid_request, invalid_credentials, account_unavailable, unsupported_media_type, rate_limited, busy, internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, device]
              properties:
                email: { $ref: "#/components/schemas/EmailInput" }
                password: { type: string }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Busy" }

  /v1/auth/password/reset/start:
    post:
      tags: [password]
      operationId: passwordResetStart
      summary: Endpoint 7. Start a password reset (Flow G).
      description: Same 202 for every email. Only an active, verified account gets a `reset_code` email.
      x-error-codes: [invalid_request, invalid_email, unsupported_media_type, rate_limited, internal_error]
      requestBody: { $ref: "#/components/requestBodies/Email" }
      responses:
        "202": { $ref: "#/components/responses/Acknowledgement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/password/reset/complete:
    post:
      tags: [password]
      operationId: passwordResetComplete
      summary: Endpoint 8. Complete a reset. Revokes every session and issues none.
      description: Also sets a first password on a passwordless account (R7).
      x-error-codes: [invalid_request, invalid_code, code_attempts_exceeded, password_policy_violation, unsupported_media_type, rate_limited, busy, internal_error]
      requestBody: { $ref: "#/components/requestBodies/CodeWithPassword" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Busy" }

  /v1/auth/token/refresh:
    post:
      tags: [session]
      operationId: tokenRefresh
      summary: Endpoint 9. Rotate a refresh token, with no grace window (R2).
      description: |
        Every refused token gets the same `401 unauthorized`. A reused token within retention
        revokes its session (R4); a client must single-flight refresh per session.
      x-error-codes: [invalid_request, unauthorized, unsupported_media_type, rate_limited, internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/auth/logout:
    post:
      tags: [session]
      operationId: logout
      summary: Endpoint 10. Revoke the current session only. No body.
      security: [{ bearerAuth: [] }]
      x-error-codes: [unauthorized, rate_limited, internal_error]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me:
    get:
      tags: [session]
      operationId: me
      summary: Endpoint 11. The authenticated account.
      security: [{ bearerAuth: [] }]
      x-error-codes: [unauthorized, rate_limited, internal_error]
      responses:
        "200":
          description: The account.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me/profile:
    put:
      tags: [account]
      operationId: updateProfile
      summary: Replace the caller’s editable profile fields (TRD 03).
      description: |
        All four fields and expected_revision are required. No query parameters.
        Stale revision conflicts; matching unchanged values are a no-op. No credential or session change.
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unauthorized, unsupported_media_type, rate_limited, internal_error, invalid_profile, profile_conflict]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileRequest" }
      responses:
        "200": { $ref: "#/components/responses/AccountUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/InvalidProfile" }
  /v1/me/email-change/start:
    post:
      tags: [account]
      operationId: emailChangeStart
      summary: Issue current- and proposed-address OTP proofs (TRD 03).
      description: |
        Both proofs bind to one request, user and acting session. Both last ten minutes, five attempts each.
        No query parameters. Starting again closes the old request and obeys existing cooldowns.
        An occupied proposed address gets the same acknowledgement, but its challenge is inert and no email is sent.
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unauthorized, unsupported_media_type, rate_limited, internal_error, invalid_email, email_unchanged]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeStart" }
      responses:
        "202": { $ref: "#/components/responses/EmailChangeStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/me/email-change/{change_id}/complete:
    post:
      tags: [account]
      operationId: emailChangeComplete
      summary: Atomically replace verified email and revoke all sessions (TRD 03).
      description: |
        Consumes both distinct, caller-bound proofs in the cutover transaction; user_id and ownership stay fixed.
        Old-address login/reset/set proofs become invalid. All sessions, including caller, lose both token types.
        Old address is released after commit; old-inbox notice omits the new address. No query parameters.
        Success returns 204. Retry normally returns 401; an already authenticated concurrent retry may get
        400 invalid_code. No receipt endpoint. After a lost response, check confirmation mail or sign in
        with the proposed new address; no error response alone proves whether the original request committed.
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unauthorized, unsupported_media_type, rate_limited, internal_error, invalid_code, code_attempts_exceeded, not_found, email_unavailable]
      parameters:
        - in: path
          name: change_id
          required: true
          schema: { type: string, format: uuid }
          description: Nonzero, 36-character hyphenated owned request UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeComplete" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "404": { $ref: "#/components/responses/OwnedRequestNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/me/sessions:
    get:
      tags: [session]
      operationId: listSessions
      summary: List the caller's owned live sessions, including the current one (TRD 02).
      description: |
        One statement snapshot; unrevoked, absolute-valid sessions with usable access or refresh.
        Current identity comes from the bearer principal. Sorted last_seen_at descending, id ascending.
        Complete list, no pagination or query parameters. Request bodies are ignored.
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unauthorized, rate_limited, internal_error]
      responses:
        "200":
          description: Complete owned live session list. Device labels are client-supplied; last seen is approximate.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [session]
      operationId: revokeAllSessions
      summary: Sign out all devices, including the current session (TRD 02).
      description: |
        Valid bearer is sufficient; clients confirm this action with the user. No body or query parameters.
        Bodies are ignored. Serializes with issuance on the user row; later valid sign-ins may create a
        new session. All preceding unrevoked rows, including expired ones, transition atomically with audit.
        A retry with the revoked bearer returns 401, which does not prove the earlier action committed.
        No operation receipt or unauthenticated replay is provided; pending login proofs remain valid.
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unauthorized, rate_limited, internal_error]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me/sessions/{session_id}:
    delete:
      tags: [session]
      operationId: revokeSession
      summary: Revoke one other owned session (TRD 02).
      description: |
        No query parameters; bodies are ignored. Unknown and foreign identifiers both return 404.
        Retained already-revoked owned rows return 204 without a new event or timestamp/reason change.
        After cleanup removes a target, a retry may return 404. Current session is refused with 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: session_id
          required: true
          description: Nonzero, 36-character hyphenated session UUID. Authentication precedes path validation.
          schema: { type: string, format: uuid }
      x-error-codes: [invalid_request, unauthorized, not_found, current_session_not_allowed, rate_limited, internal_error]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/SessionNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me/password/set/start:
    post:
      tags: [password]
      operationId: passwordSetStart
      summary: Endpoint 12. Start a first-password set (Flow E). No body.
      description: The challenge is bound to the caller's user and session (R6).
      security: [{ bearerAuth: [] }]
      x-error-codes: [unauthorized, password_already_set, rate_limited, internal_error]
      responses:
        "202": { $ref: "#/components/responses/Acknowledgement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/me/password/set:
    post:
      tags: [password]
      operationId: passwordSet
      summary: Endpoint 13. Set a first password. Keeps this session, revokes all others (AC-28).
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, invalid_code, code_attempts_exceeded, unauthorized, password_already_set, password_policy_violation, unsupported_media_type, rate_limited, busy, internal_error]
      requestBody: { $ref: "#/components/requestBodies/CodeWithPassword" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Busy" }
  /v1/me/password:
    put:
      tags: [password]
      operationId: passwordChange
      summary: Endpoint 14. Change the password. Keeps this session, revokes all others (AC-11).
      description: |
        No retry exception: a resend after a lost response is evaluated like any other request
        and normally gets `403 invalid_current_password` (TRD 5.4, R10).
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unauthorized, invalid_current_password, password_not_set, password_policy_violation, unsupported_media_type, rate_limited, busy, internal_error]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Busy" }

  /v1/me/deactivate:
    post:
      tags: [account]
      operationId: deactivateAccount
      summary: Deactivate and revoke all sessions; no retry receipt.
      security: [{ bearerAuth: [] }]
      x-error-codes: [invalid_request, unsupported_media_type, rate_limited, internal_error, unauthorized, lifecycle_conflict, last_super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeactivateRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/account-rights/export/start:
    post:
      tags: [account]
      operationId: startAccountExport
      summary: Start an operation-bound mailbox proof; identical inert acknowledgement.
      x-error-codes: [invalid_request, unsupported_media_type, rate_limited, internal_error, invalid_email]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRightsRequest" }
      responses:
        "202":
          description: Successful operation.
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
            Cache-Control: { $ref: "#/components/headers/Cache-Control" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RightsStarted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/account-rights/export/{operation_id}/complete:
    post:
      tags: [account]
      operationId: completeAccountExport
      summary: Consume fresh proof atomically; accepted retries return the same operation.
      security: [{ rightsAuth: [] }]
      parameters:
        - in: path
          name: operation_id
          required: true
